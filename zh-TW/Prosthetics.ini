# Original: Cybernetic Eye
"prosthetic_eye" = "電子義眼"
# Original: A battery-powered eye. Restores sight in one socket while it has charge. Press F to activate light mode.\n\nIn wound view: any tool (knife, screwdriver, etc) ejects the battery. A fork ejects the battery first, then pulls the eye once the socket is empty; a wrench pulls the whole eye out, battery and all.
"prosthetic_eyedsc" = "一隻由電池驅動的眼睛。在有電時可以恢復一側眼眶的視力。按F鍵激活照明模式。\n\n在醫療面板中：使用任何工具（小刀、螺絲刀等）可彈出電池。使用叉子會先彈出電池，待眼眶清空後再取出眼球；使用扳手會直接扯出整隻眼睛（含電池）。"
# Original: Pain Blocker
"neuromod_painblock" = "止痛模塊"
# Original: Suppresses nerve pain signals  - all incoming pain is halved while installed.\n\n<color="red">Ejecting this neuromod is dangerous. Expect brain flash and vomiting.
"neuromod_painblockdsc" = "抑制神經疼痛信號——安裝後受到的所有疼痛減半。\n\n<color=\"red\">彈出此神經模組非常危險。預計會導致腦閃和嘔吐。"
# Original: Trap Detector
"neuromod_trapdetect" = "陷阱探測器"
# Original: Highlights all nearby traps with a red glow. Beartraps, landmines, coils and more.\n\n<color="red">Ejecting this neuromod is dangerous. Expect brain flash and vomiting.
"neuromod_trapdetectdsc" = "用紅色光芒高亮標記附近的所有陷阱。包括捕獸夾、地雷、線圈等。\n\n<color=\"red\">彈出此神經模組非常危險。預計會導致腦閃和嘔吐。"
# Original: Sonic Screamer Neuromod
"neuromod_sonicscreamer" = "聲波尖嘯器神經模組"
# Original: Emits a high-frequency sonic burst  - sends all nearby creatures fleeing in a 25 unit radius for 2 seconds.\n\n<color="red">3 uses. Safe to eject  - item is returned.
"neuromod_sonicscreamerdsc" = "發出高頻聲波爆發，使附近25單位半徑內的所有生物逃離2秒。\n\n<color=\"red\">可使用3次。安全彈出——物品會歸還。"
# Original: Masochist Neuromod
"neuromod_crackedpainmod" = "受虐狂神經模組"
# Original: A damaged pain neuromod, clearly ripped from someone else. Pain hurts 10% more with it in, but you start enjoying it  - mood rises passively the more you hurt.\n\n<color="red">Removing this neuromod deals 5 brain damage, a brain flash, and 15 head pain.
"neuromod_crackedpainmoddsc" = "一個受損的痛覺神經模組，顯然是從別人身上強行剝離出來的。安裝後疼痛感增加10%，但你會開始享受它——你受到的痛苦越多，情緒值就會被動提升。\n\n<color=\"red\">移除此神經模組會造成5點腦損傷、一次腦閃和15點頭部疼痛。"
# Original: Balance Neuromod
"neuromod_adrenalinesurge" = "平衡神經模組"
# Original: When ragdolled and still conscious, you can activate it and stand up no matter what (even in air). Hurts like hell.\n\n<color="red">Infinite uses, 1-minute cooldown. Safe to eject  - item is returned.
"neuromod_adrenalinesurgedsc" = "當被擊倒且仍清醒時，你可以激活它並無論如何都能站起來（甚至在半空中）。痛得要命。\n\n<color=\"red\">無限使用，冷卻1分鐘。安全彈出——物品會歸還。"
# Original: Sandevistan Neuromod
"neuromod_sandivistian" = "斯安威斯坦神經模組"
# Original: A neural mod implanted in the brain, allowing the player to greatly increase reaction and action speed for a short duration.
"neuromod_sandivistiandsc" = "一種植入大腦的神經模組，允許玩家在短時間內大幅度提升反應和行動速度。"
# Original: Scanning Neuromod
"neuromod_scanningchip" = "掃描神經模組"
# Original: Hold an item and activate to scan it for 3 seconds. Reveals the recipe and marks the item type as recognized for good.\n\n<color="green">Safe to eject  - no side effects.
"neuromod_scanningchipdsc" = "手持物品並激活以對其掃描3秒。解明其配方並將該物品類型永久標記為已識別。\n\n<color=\"green\">安全彈出——無副作用。"
# Original: Steady Hand Augment
"augment_steadyhand" = "穩定手增強件"
# Original: Wrist-mounted gyroscope. While powered, gun recoil drops by half and a live ammo count shows next to the held-item HUD. Small or medium battery.
"augment_steadyhanddsc" = "腕部安裝的陀螺儀。通電時，槍械後坐力減半，並在手持物品HUD旁顯示實時彈藥數量。適用小型或中型電池。"
# Original: Power Grip Augment
"augment_powergrip" = "強力握持增強件"
# Original: Servo grip in the palm. While powered, held items weigh half, you hit harder and throw farther — and you won't drop what you're holding even if you pass out. Small or medium battery.
"augment_powergripdsc" = "掌心內的伺服握持器。通電後，手持物品重量減半，打擊更強、投擲更遠——即使昏迷也不會掉落物品。適用小型或中型電池。"
# Original: Hacking Augment
"augment_hacking" = "駭入插件"
# Original: Intrusion suite wired into the hand. Skips lock minigames, keypads, and blood terminals — at a charge cost per hack. Always-on while powered. Small battery can't crack a blood terminal; medium can.
"augment_hackingdsc" = "手部內置入侵套件。跳過撬鎖小遊戲、鍵盤鎖和生物終端——每次破解消耗電量。通電時始終可用。小型電池無法破解生物終端，中型電池可以。"
# Original: Augment Implant Tool
"augment_implant_tool" = "增強件植入工具"
# Original: Cuts a single augment socket into a biological arm, leg, or torso — run augments without going full prosthetic. Use in the wound view on a Shoulder, Thigh, or Torso.\n\n<color="red">Single use. Slot is gone the moment the limb is severed.
"augment_implant_tooldsc" = "在生物手臂、腿部或軀幹上切出一個單獨的增強件插槽——無需進行完全的義肢替換即可運行增強件。在醫療面板中對肩膀、大腿或軀幹使用。\n\n<color=\"red\">一次性使用。肢體被切斷後該插槽會消失。"
# Original: Power Steps Augment
"augment_powersteps" = "動力步伐增強件"
# Original: Servo pistons in the thigh. While powered and active, leg speed and jump height climb +12.5% per leg — +25% with both. Small, medium, or large battery. One hotbar key fires both legs.
"augment_powerstepsdsc" = "大腿內的伺服活塞。通電並激活時，每條腿提升12.5%移動速度和跳躍高度——雙腿均安裝則提升25%。適用小型、中型或大型電池。一個快捷欄按鍵同時激活雙腿。"
# Original: Bone Saw
"bonesaw" = "骨鋸"
# Original: A proper surgical bone saw. The right tool for a clean cut.\n\n<color="red">Can be used in the health panel to amputate any limb, even without infection or damage.
"bonesawdsc" = "一把正規的手術骨鋸。是進行乾淨利落切割的正確工具。\n\n<color=\"red\">可在醫療面板中使用以截除任何肢體，即使沒有受到感染或損傷。"
# Original: Makeshift Bone Saw
"makeshiftbonesaw" = "簡易骨鋸"
# Original: A crude improvised bone saw. Gets the job done, barely.\n\n<color="red">Can be used in the health panel to amputate any limb, even without infection or damage.
"makeshiftbonesawdsc" = "一把粗糙的臨時自制骨鋸。勉強能把工作搞定。\n\n<color=\"red\">可在醫療面板中使用以截除任何肢體，即使沒有受到感染或損傷。"
# Original: A strip of clean bandage cloth. Absorbs 25 wetness per use when used from inventory. 10 uses. Also works as a proper dressing on wounds.
"rippeddressingdsc" = "一條幹淨的繃帶布。在物品欄中使用時，每次使用能吸收25點潮溼度。可使用10次。也可用作傷口的正規敷料。"
# Original: Plastic Fork
"plasticfork" = "塑料叉子"
# Original: I mean, it would be funny to poke an eye out from your friend or yourself to make space for the cool prosthetic eye, right? One use.\n\n<color="red">Drag onto your head in the health panel to remove a biological eye.\n<color="green">Also pries out an installed prosthetic eye without breaking it.
"plasticforkdsc" = "我是說，把你自己或者你朋友的眼珠子戳出來，好騰出位置來裝上那個超酷的義眼，這聽起來很有趣對吧？一次性使用。\n\n<color=\"red\">在醫療面板中將其拖動到頭部以移除生物眼睛。\n<color=\"green\">也可以在不損壞已安裝義眼的情況下撬出義眼。"
# Original: Grappling Hook
"grapplinghook" = "抓鉤槍"
# Original: A grappling hook device that can be fired to pull the player.
"grapplinghookdsc" = "一種可以發射抓鉤把將玩家拉過去的裝置。"
# Original: Scrap
"scrap" = "廢料"
# Original: A pile of scrap metal or electronic waste with no fixed purpose, can be used for crafting, upgrading, or recycling.
"scrapdsc" = "一堆沒有固定用途的金屬廢料或電子垃圾，可用於製作、升級或回收。"
# Original: Battery
"battery" = "電池"
# Original: Standard power component to power various electronic prosthetics and modules.
"batterydsc" = "標準電源組件，用於給各種電子義體和模組供電。"
# Original: Medical
"medical" = "醫療用品"
# Original: Lockin Neuromod
"neuromod_lockin" = "鎖定神經模組"
# Original: Shocks and force-starts specific neurons in the brain  - forces you awake for a minute no matter the state. The only neuromod usable while unconscious.\n\n<color="red">Costs 10 brain integrity and 15 head muscle per use  - can be lethal at low brain. 2-minute cooldown. Safe to eject  - item is returned.
"neuromod_lockindsc" = "電擊並強制啟動大腦中的特定神經元——無論處於何種狀態都能強制清醒一分鐘。唯一可在昏迷狀態下使用的神經模組。\n\n<color=\"red\">每次使用消耗10點腦完整度和15點頭部肌肉——腦部較低時可能致命。冷卻時間2分鐘。安全彈出——物品會歸還。"
# Original: Treadmill Augment
"augment_treadmill" = "跑步機增強件"
# Original: Kinetic leg treadmill. Slot any battery (even empty), activate it, and moving or jumping slowly recharges it — big batteries fill slower. While active it drags leg speed & jump down 25% per leg (−50% with both). Auto-switches off when full. Can't activate a full or empty slot. One hotbar key fires both legs.
"augment_treadmilldsc" = "動能腿部跑步機。插入任意電池（甚至空電池），激活後，移動或跳躍會緩慢為其充電——大電池充電速度更慢。激活時每條腿的移動速度和跳躍高度降低25%（雙腿均安裝則降低50%）。充滿後自動關閉。無法在滿電或無電池插槽中激活。一個快捷欄按鍵同時激活雙腿。"
# Original: RTG Generator
"augment_rtg" = "同位素發電機"
# Original: A radioisotope thermoelectric generator bolted into the chest. Toggle it on to trickle-charge every augment battery and energy cell on your body at once — hands, legs, bio-limbs and other torso implants. It bleeds radiation while it runs, glows blue, and shuts itself off the moment everything is topped up. Installs into an open torso augment slot.\n\n<color="red">Permanent — once implanted it cannot be removed. It only comes out if the torso is severed.
"augment_rtgdsc" = "一臺鉚接在胸腔內的放射性同位素熱電發生器。開啟後會緩慢為全身所有增強件電池和能量單元充電——包括手臂、腿部、生物肢體及其他軀幹植入物。運行時持續釋放輻射，發出藍光，所有設備充滿後自動關閉。安裝在空的軀幹增強插槽中。\n\n<color=\"red\">永久性——植入後無法移除。只有在軀幹被切斷時才會脫落。"
# Original: BFF-Field
"augment_ballistic" = "BFF力場"
# Original: \n\n<i>you've never seen this before, looks like a very advanced augment, a white sticker on it says:</i>\n\n<color="yellow">experimental - protects from impact to the body, don't try it without me</color>\n\n<color="red">Permanent — once implanted it cannot be removed. It only comes out if the torso is severed.
"augment_ballisticdsc" = "\n\n<i>你以前從未見過這個，看起來是一種非常先進的增強件，上面貼著一張白色標籤：</i>\n\n<color=\"yellow\">實驗性——保護身體免受衝擊，沒有我在場時不要嘗試</color>\n\n<color=\"red\">永久性——植入後無法移除。只有在軀幹被切斷時才會脫落。"
# Original: MYX-Vat
"augment_regen" = "MYX再生艙"
# Original: \n\n<i>you've never seen this before, looks like a very advanced augment, a grubby white sticker peeling off it reads:</i>\n\n<color="yellow">experimental - keeps the body stitching itself back together, the greying is normal, mind that it feeds on you, don't try it without me</color>\n\n<color="red">Permanent — once implanted it cannot be removed. It only comes out if the torso is severed.
"augment_regendsc" = "\n\n<i>你以前從未見過這個，看起來是一種非常先進的增強件，上面貼著一張髒兮兮的白色標籤，邊緣已經翹起：</i>\n\n<color=\"yellow\">實驗性——讓身體自行修復縫合，變灰是正常現象，注意它會以你為食，沒有我在場時不要嘗試</color>\n\n<color=\"red\">永久性——植入後無法移除。只有在軀幹被切斷時才會脫落。"
# Original: Press anywhere on the line and drag along it, either way around  - stray off and you burn extra charge.
"weldingMinigameGuide" = "在線上任意位置按下並沿其拖動，無論朝哪個方向——偏移軌道會額外消耗電量。"
